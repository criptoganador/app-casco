<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Monitoreo - Cascos Inteligentes LiveKit</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f1115;
            --sidebar-bg: #181b21;
            --card-bg: #222630;
            --card-hover: #2d3340;
            --card-active: #1e3a8a;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #2e3545;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* BARRA LATERAL */
        #sidebar {
            width: 340px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .sidebar-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-livekit {
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary);
            border: 1px solid rgba(59, 130, 246, 0.3);
            font-size: 0.68rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .refresh-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }

        .refresh-info {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.76rem;
            transition: all 0.2s;
        }
        .refresh-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* CONEXIÓN MANUAL */
        .manual-connect {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
        }

        .manual-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-room {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-room:focus { border-color: var(--primary); }

        .btn-connect {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-connect:hover { background: var(--primary-hover); }

        /* LISTA DE SALAS */
        .section-label {
            padding: 12px 20px 4px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #rooms-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .room-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-card:hover { background: var(--card-hover); border-color: #4b5563; transform: translateY(-1px); }
        .room-card.active { background: var(--card-active); border-color: #60a5fa; box-shadow: 0 4px 14px rgba(29,78,216,0.3); }

        .agent-info { display: flex; flex-direction: column; gap: 4px; }
        .agent-name { font-size: 0.95rem; font-weight: 600; color: #fff; }
        .agent-sub { font-size: 0.72rem; color: var(--text-muted); }
        .room-card.active .agent-sub { color: #bfdbfe; }

        .live-tag {
            font-size: 0.72rem;
            color: var(--success);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.12);
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%   { transform: scale(0.95); opacity: 0.7; }
            50%  { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .no-signals {
            text-align: center;
            color: var(--text-muted);
            padding: 36px 16px;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        /* ÁREA PRINCIPAL */
        #main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        #status-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(15,17,21,0.9);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.84rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 5;
        }

        .toolbar {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 10px;
            z-index: 5;
        }

        .tool-btn {
            background: rgba(15,17,21,0.85);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .tool-btn:hover { border-color: var(--primary); background: var(--card-bg); }

        #video-container {
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 12px;
            pointer-events: none;
            background: #000;
        }

        .placeholder-icon { font-size: 3.2rem; opacity: 0.5; }
    </style>
</head>
<body>

    <!-- BARRA LATERAL -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="header-top">
                <span class="sidebar-title">🛡️ Cascos en Vivo</span>
                <span class="badge-livekit">LiveKit SFU</span>
            </div>
            <div class="refresh-row">
                <span class="refresh-info" id="refreshInfo">Consultando salas...</span>
                <button class="refresh-btn" onclick="fetchRooms()">↻ Actualizar</button>
            </div>
        </div>

        <!-- Conexión manual directa -->
        <div class="manual-connect">
            <div class="manual-title">Conectar por nombre</div>
            <div class="input-group">
                <input type="text" id="manualRoomInput" class="input-room" placeholder="Nombre de sala (ej: jhoan)" />
                <button class="btn-connect" onclick="connectManual()">Ver</button>
            </div>
        </div>

        <div class="section-label">Salas detectadas en la nube</div>
        <div id="rooms-list">
            <div class="no-signals">Buscando transmisiones activas...</div>
        </div>
    </div>

    <!-- ÁREA PRINCIPAL -->
    <div id="main-area">
        <div id="status-overlay">
            <div id="statusDot" style="width:8px;height:8px;border-radius:50%;background:#9ca3af;"></div>
            <span id="statusText">Selecciona un agente o escribe el nombre de la sala</span>
        </div>

        <div class="toolbar">
            <button class="tool-btn" id="btnMute" onclick="toggleMute()">🔊 Sonido</button>
            <button class="tool-btn" onclick="toggleFullscreen()">⛶ Pantalla Completa</button>
        </div>

        <div id="video-container">
            <div id="placeholder">
                <div class="placeholder-icon">📡</div>
                <p id="placeholderText">Esperando conexión de agente...</p>
            </div>
            <video id="remoteVideo" autoplay playsinline muted></video>
            <audio id="remoteAudio" autoplay></audio>
        </div>
    </div>

    <script>
        // ─────────────────────────────────────────────
        // CONFIGURACIÓN LIVEKIT CLOUD
        // ─────────────────────────────────────────────
        const LIVEKIT_URL    = "wss://asicme-casco-xlxbe39o.livekit.cloud";
        const LIVEKIT_API    = "https://asicme-casco-xlxbe39o.livekit.cloud";
        const API_KEY        = "APIutSnBDwPrHSM";
        const API_SECRET     = "DYIeeEd4f2ljsCgOQN2wb7ypHErawhAmeEBm0gVq5TmD";

        let currentRoom   = null;
        let currentRoomId = null;
        let pollInterval  = null;

        const videoEl         = document.getElementById('remoteVideo');
        const audioEl         = document.getElementById('remoteAudio');
        const statusText      = document.getElementById('statusText');
        const statusDot       = document.getElementById('statusDot');
        const listEl          = document.getElementById('rooms-list');
        const placeholder     = document.getElementById('placeholder');
        const placeholderText = document.getElementById('placeholderText');
        const refreshInfo     = document.getElementById('refreshInfo');
        const manualInput     = document.getElementById('manualRoomInput');

        // Permitir conectar presionando Enter en el input
        manualInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') connectManual();
        });

        // ─────────────────────────────────────────────
        // GENERADOR DE TOKEN JWT (HMAC-SHA256)
        // ─────────────────────────────────────────────
        async function buildToken(claims) {
            const b64 = s => btoa(unescape(encodeURIComponent(s)))
                .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

            const b64arr = buf => {
                let s = '';
                new Uint8Array(buf).forEach(b => s += String.fromCharCode(b));
                return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
            };

            const header  = b64(JSON.stringify({ alg: 'HS256', typ: 'JWT' }));
            const payload = b64(JSON.stringify(claims));
            const msg     = `${header}.${payload}`;
            const key     = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(API_SECRET),
                { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
            );
            const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(msg));
            return `${msg}.${b64arr(sig)}`;
        }

        async function adminToken() {
            const now = Math.floor(Date.now() / 1000);
            return buildToken({
                iss: API_KEY, sub: 'monitor-admin',
                nbf: now - 5, exp: now + 300,
                video: { roomList: true }
            });
        }

        async function viewerToken(roomName) {
            const now = Math.floor(Date.now() / 1000);
            return buildToken({
                iss: API_KEY, sub: 'monitor-pc-' + Math.random().toString(36).slice(2, 7),
                nbf: now - 5, exp: now + 86400,
                video: { room: roomName, roomJoin: true, canPublish: false, canSubscribe: true }
            });
        }

        // ─────────────────────────────────────────────
        // CONSULTA DE SALAS LIVEKIT (API REST TWIRP)
        // ─────────────────────────────────────────────
        async function fetchRooms() {
            try {
                const token = await adminToken();
                const res = await fetch(`${LIVEKIT_API}/twirp/livekit.RoomService/ListRooms`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
                const data = await res.json();
                renderRooms(data.rooms || []);

                const now = new Date();
                refreshInfo.textContent = `Actualizado: ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            } catch (err) {
                console.warn('Error consultando salas LiveKit:', err);
                refreshInfo.textContent = 'Aviso: Consulta directa con API';
            }
        }

        function renderRooms(rooms) {
            listEl.innerHTML = '';

            if (!rooms || rooms.length === 0) {
                listEl.innerHTML = `
                    <div class="no-signals">
                        <div style="font-size:1.8rem;margin-bottom:6px">📡</div>
                        No se detectaron salas activas en LiveKit.<br>
                        <small>Escribe el nombre arriba o inicia la transmisión en la app móvil.</small>
                    </div>`;
                return;
            }

            rooms.forEach(room => {
                const cleanName = (room.name || '').trim();
                const participants = room.num_participants !== undefined ? room.num_participants : (room.numParticipants || 0);
                const publishers   = room.num_publishers !== undefined ? room.num_publishers : (room.numPublishers || 0);
                const isLive = participants > 0;

                const card = document.createElement('div');
                card.className = `room-card ${currentRoomId === cleanName ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="agent-info">
                        <span class="agent-name">${cleanName}</span>
                        <span class="agent-sub">${participants} usuario(s) · ${publishers} cámara(s)</span>
                    </div>
                    ${isLive ? `
                        <div class="live-tag">
                            <span class="live-dot"></span>
                            <span>EN VIVO</span>
                        </div>
                    ` : `
                        <span style="font-size:0.72rem;color:var(--text-muted)">Inactivo</span>
                    `}`;

                card.onclick = () => connectToRoom(cleanName);
                listEl.appendChild(card);
            });
        }

        function connectManual() {
            const val = manualInput.value.trim();
            if (!val) {
                alert('Por favor ingresa el nombre de la sala o agente');
                return;
            }
            connectToRoom(val);
        }

        // ─────────────────────────────────────────────
        // CONEXIÓN Y VISUALIZACIÓN WEBRTC CON LIVEKIT SDK
        // ─────────────────────────────────────────────
        async function connectToRoom(roomName) {
            const cleanRoom = (roomName || '').trim();
            if (!cleanRoom) return;

            if (currentRoomId === cleanRoom && currentRoom) {
                console.log('Ya estás conectado a esta sala:', cleanRoom);
                return;
            }

            if (currentRoom) {
                try { await currentRoom.disconnect(); } catch (e) {}
                currentRoom = null;
            }

            currentRoomId = cleanRoom;
            manualInput.value = cleanRoom;
            document.querySelectorAll('.room-card').forEach(el => el.classList.remove('active'));

            setStatus('connecting', `Conectando con sala "${cleanRoom}"...`);
            placeholderText.textContent = `Conectando con "${cleanRoom}"...`;
            placeholder.style.display = 'flex';

            try {
                const token = await viewerToken(cleanRoom);
                const room  = new LivekitClient.Room({
                    adaptiveStream: true,
                    dynacast: true,
                    autoSubscribe: true
                });

                function attachTrack(track, participant) {
                    if (track.kind === LivekitClient.Track.Kind.Video || track.kind === 'video') {
                        console.log('Adjuntando pista de video de:', participant ? participant.identity : 'remoto');
                        track.attach(videoEl);
                        videoEl.play().catch(e => console.warn('Autoplay aviso:', e));
                        placeholder.style.display = 'none';
                        const id = participant ? participant.identity : cleanRoom;
                        setStatus('online', `Transmitiendo en vivo: ${cleanRoom} (${id})`);
                    } else if (track.kind === LivekitClient.Track.Kind.Audio || track.kind === 'audio') {
                        track.attach(audioEl);
                        audioEl.play().catch(e => console.warn('Audio play aviso:', e));
                    }
                }

                // 1. Evento cuando un participante nuevo publica o se suscribe un track
                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, _pub, participant) => {
                    console.log('LiveKit TrackSubscribed:', track.kind, participant.identity);
                    attachTrack(track, participant);
                });

                room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
                    console.log('LiveKit TrackUnsubscribed:', track.kind);
                    track.detach();
                    if (track.kind === LivekitClient.Track.Kind.Video || track.kind === 'video') {
                        placeholder.style.display = 'flex';
                        placeholderText.textContent = 'Transmisión detenida por el agente.';
                        setStatus('idle', `Transmisión de "${cleanRoom}" detenida`);
                    }
                });

                room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
                    console.log('Participante conectado:', participant.identity);
                    setStatus('connecting', `Agente "${participant.identity}" conectado. Esperando video...`);
                });

                room.on(LivekitClient.RoomEvent.Disconnected, () => {
                    console.log('Desconectado de LiveKit');
                    currentRoom   = null;
                    currentRoomId = null;
                    placeholder.style.display = 'flex';
                    placeholderText.textContent = 'Desconectado. Selecciona un agente.';
                    setStatus('idle', 'Desconectado.');
                    fetchRooms();
                });

                // Conectar al servidor LiveKit SFU
                await room.connect(LIVEKIT_URL, token);
                currentRoom = room;
                setStatus('connecting', `Conectado a "${cleanRoom}". Esperando cámara USB...`);
                placeholderText.textContent = `Conectado a "${cleanRoom}". Esperando envío de fotogramas...`;

                // 2. Si el agente YA estaba transmitiendo antes de que abriéramos el visor:
                room.remoteParticipants.forEach(participant => {
                    participant.trackPublications.forEach(pub => {
                        if (pub.track) {
                            attachTrack(pub.track, participant);
                        } else if (pub.isSubscribed === false) {
                            pub.setSubscribed(true);
                        }
                    });
                });

                // Resaltar visualmente la tarjeta seleccionada
                document.querySelectorAll('.room-card').forEach(el => {
                    if (el.querySelector('.agent-name')?.textContent === cleanRoom) {
                        el.classList.add('active');
                    }
                });

            } catch (err) {
                console.error('Error conectando a LiveKit:', err);
                setStatus('idle', `Error: ${err.message}`);
                placeholderText.textContent = `Error conectando: ${err.message}`;
            }
        }

        function setStatus(state, text) {
            statusText.textContent = text;
            const colors = {
                online:     { bg: '#10b981', shadow: '0 0 10px #10b981' },
                connecting: { bg: '#f59e0b', shadow: '0 0 8px #f59e0b' },
                idle:       { bg: '#9ca3af', shadow: 'none' }
            };
            const c = colors[state] || colors.idle;
            statusDot.style.background = c.bg;
            statusDot.style.boxShadow  = c.shadow;
        }

        function toggleMute() {
            videoEl.muted = !videoEl.muted;
            document.getElementById('btnMute').textContent = videoEl.muted ? '🔇 Mute' : '🔊 Sonido';
        }

        function toggleFullscreen() {
            const container = document.getElementById('video-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(e => console.warn(e));
            } else {
                document.exitFullscreen().catch(e => console.warn(e));
            }
        }

        // Iniciar polling cada 5 segundos
        fetchRooms();
        pollInterval = setInterval(fetchRooms, 5000);
    </script>
</body>
</html>
